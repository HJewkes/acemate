name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  workspace:
    strategy:
      fail-fast: false
      matrix:
        workspace: [packages/core, tools/cli, apps/web, apps/controller]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
        working-directory: ${{ matrix.workspace }}
      - run: npm test
        working-directory: ${{ matrix.workspace }}
      - if: matrix.workspace == 'apps/web'
        run: npm run build
        working-directory: apps/web

  apps-controller-web:
    runs-on: ubuntu-latest
    env:
      EXPO_BASE_URL: /acemate/next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run export:web
        working-directory: apps/controller
      - run: npm run check:web
        working-directory: apps/controller

  check:
    if: always()
    needs: [lint, workspace, apps-controller-web]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
