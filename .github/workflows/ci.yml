name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  workspace:
    strategy:
      fail-fast: false
      matrix:
        workspace: [packages/core, tools/cli, apps/controller]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
        working-directory: ${{ matrix.workspace }}
      - run: npm test
        working-directory: ${{ matrix.workspace }}

  apps-controller-web:
    runs-on: ubuntu-latest
    env:
      EXPO_BASE_URL: /acemate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run export:web
        working-directory: apps/controller
      - run: npm run check:web
        working-directory: apps/controller
      - run: npx playwright install --with-deps chromium
        working-directory: apps/controller
      # Renders the export at every phone, tablet and laptop size with safe-area insets emulated; fails on text
      # that is ellipsized or cut off, and on controls off screen, under an inset or overlapping.
      - run: npm run check:viewports
        working-directory: apps/controller
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-report
          path: apps/controller/viewport-report
          if-no-files-found: ignore

  check:
    if: always()
    needs: [lint, workspace, apps-controller-web]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
