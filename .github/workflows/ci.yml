name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      # Type-aware rules resolve each package's own dependencies.
      - run: |
          for dir in tools/drive-probe tools/web-drive apps/web apps/controller; do
            npm ci --prefix "$dir"
          done
      - run: npm run lint

  drive-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/drive-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-drive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/web-drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apps-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apps-controller-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/controller
    env:
      EXPO_BASE_URL: /acemate/next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run export:web
      - run: npm run check:web

  check:
    if: always()
    needs: [lint, drive-probe, web-drive, web, apps-controller, apps-controller-web]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
