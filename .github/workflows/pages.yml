name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run export:web && npm run check:web
        working-directory: apps/controller
        env:
          EXPO_BASE_URL: /acemate
      # Expo's generated folders start with an underscore, which Jekyll would drop.
      - run: touch apps/controller/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/controller/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
